<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
  <title id="title">Illustrative LCD service screens</title><desc id="description">Four mockups show the dashboard, PAN, ATM, and driving licence screens.</desc>
  <style>.panel{fill:#1e293b;stroke:#0f172a;stroke-width:8}.lcd{fill:#c6e6a6;stroke:#6b8e45;stroke-width:6}.txt{font-family:monospace;fill:#19310d;font-size:21px;font-weight:bold}.label{font-family:Arial,sans-serif;fill:#0f172a;font-size:24px;font-weight:bold;text-anchor:middle}</style>
  <rect width="1200" height="840" fill="#fff"/><text x="600" y="52" class="label" font-size="32">Illustrative LCD Demonstration Screens</text>
  <g transform="translate(65 105)"><text x="240" y="-15" class="label">Dashboard</text><rect width="480" height="235" rx="22" class="panel"/><rect x="36" y="38" width="408" height="158" rx="6" class="lcd"/><text x="62" y="75" class="txt"> RFID UNIFIED SYSTEM</text><text x="62" y="108" class="txt">1:PAN  2:ATM</text><text x="62" y="141" class="txt">3:VOTE 4:DL</text><text x="62" y="174" class="txt">#:Officer Mode</text></g>
  <g transform="translate(655 105)"><text x="240" y="-15" class="label">PAN Service</text><rect width="480" height="235" rx="22" class="panel"/><rect x="36" y="38" width="408" height="158" rx="6" class="lcd"/><text x="62" y="75" class="txt">PAN DETAILS</text><text x="62" y="108" class="txt">Name: Tagore</text><text x="62" y="141" class="txt">PAN: XYZWV9876A</text><text x="62" y="174" class="txt">*: Back</text></g>
  <g transform="translate(65 490)"><text x="240" y="-15" class="label">ATM Service</text><rect width="480" height="235" rx="22" class="panel"/><rect x="36" y="38" width="408" height="158" rx="6" class="lcd"/><text x="62" y="75" class="txt">ATM SERVICES</text><text x="62" y="108" class="txt">1:Balance 2:Deposit</text><text x="62" y="141" class="txt">3:Withdraw</text><text x="62" y="174" class="txt">*: Back</text></g>
  <g transform="translate(655 490)"><text x="240" y="-15" class="label">Driving License</text><rect width="480" height="235" rx="22" class="panel"/><rect x="36" y="38" width="408" height="158" rx="6" class="lcd"/><text x="62" y="75" class="txt">DRIVING LICENSE</text><text x="62" y="108" class="txt">DL: DL-22201302</text><text x="62" y="141" class="txt">Class: 2 Wheeler</text><text x="62" y="174" class="txt">Vote: One time only</text></g>
</svg>
